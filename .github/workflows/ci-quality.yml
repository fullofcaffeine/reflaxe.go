name: CI - Quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"
  HAXE_SETUP_RETRY_ATTEMPTS: "4"
  HAXE_SETUP_RETRY_DELAY_SEC: "5"
  HAXE_SETUP_RETRY_BACKOFF: "linear"
  HAXE_SETUP_WARMUP_ATTEMPTS: "3"

jobs:
  test-ci:
    name: test:ci (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.22.x"
          - os: ubuntu-latest
            go: "1.23.x"
          - os: macos-latest
            go: "1.23.x"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Install npm dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Setup Haxe (linux, primary)
        if: runner.os != 'macOS'
        id: setup_haxe_linux
        continue-on-error: true
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Haxe (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install haxe neko
          BREW_PREFIX="$(brew --prefix)"
          echo "${BREW_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix neko)/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=$(brew --prefix haxe)/lib/haxe/std" >> "$GITHUB_ENV"
          command -v haxe
          command -v haxelib
          haxe -version

      - name: Ensure Haxe toolchain (linux)
        if: runner.os != 'macOS'
        shell: bash
        env:
          SETUP_HAXE_OUTCOME: ${{ steps.setup_haxe_linux.outcome }}
        run: |
          set -euo pipefail
          warmup_attempts="${HAXE_SETUP_WARMUP_ATTEMPTS:-3}"
          if ! [[ "$warmup_attempts" =~ ^[1-9][0-9]*$ ]]; then
            echo "[haxe-setup] error: HAXE_SETUP_WARMUP_ATTEMPTS must be a positive integer" >&2
            exit 2
          fi

          warmup_haxe() {
            local attempt=1
            while (( attempt <= warmup_attempts )); do
              if command -v haxe >/dev/null 2>&1 && command -v haxelib >/dev/null 2>&1; then
                if haxe -version >/tmp/haxe-version.out 2>/tmp/haxe-version.err && haxelib version >/tmp/haxelib-version.out 2>/tmp/haxelib-version.err; then
                  echo "[haxe-setup] warmup success on attempt ${attempt}/${warmup_attempts}"
                  cat /tmp/haxe-version.out
                  cat /tmp/haxelib-version.out
                  return 0
                fi
                cat /tmp/haxe-version.err >&2 || true
                cat /tmp/haxelib-version.err >&2 || true
              fi

              if (( attempt < warmup_attempts )); then
                local delay=$((attempt * 2))
                echo "[haxe-setup] warmup failed on attempt ${attempt}; retrying in ${delay}s"
                sleep "$delay"
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          if [[ "${SETUP_HAXE_OUTCOME:-success}" != "success" ]]; then
            echo "[haxe-setup] primary setup action outcome=${SETUP_HAXE_OUTCOME}; running fallback installer"
            bash scripts/ci/setup-haxe-linux-fallback.sh
          fi

          if ! warmup_haxe; then
            echo "[haxe-setup] warmup failed after primary setup; running fallback installer"
            bash scripts/ci/setup-haxe-linux-fallback.sh
            warmup_haxe
          fi

      - name: Run stable CI surface
        run: npm run test:ci
