name: CI - Quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  HAXE_VERSION: "4.3.7"
  HAXE_SETUP_RETRY_ATTEMPTS: "4"
  HAXE_SETUP_RETRY_DELAY_SEC: "5"
  HAXE_SETUP_RETRY_BACKOFF: "linear"
  HAXE_SETUP_WARMUP_ATTEMPTS: "3"

jobs:
  test-ci:
    name: test:ci (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.25.13"
          - os: ubuntu-latest
            go: "1.26.6"
          - os: macos-latest
            go: "1.26.6"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned npm
        run: bash scripts/ci/setup-pinned-npm.sh

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Setup Haxe (linux)
        if: runner.os != 'macOS'
        uses: ./.github/actions/setup-haxe-linux
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          warmup-attempts: ${{ env.HAXE_SETUP_WARMUP_ATTEMPTS }}

      - name: Setup Haxe (macOS)
        if: runner.os == 'macOS'
        uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Run stable CI surface
        run: npm run test:ci

      - name: Upload official Haxe target smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-haxe-target-smoke-${{ runner.os }}-go-${{ matrix.go }}
          path: .cache/official-haxe-target-smoke/artifacts
          if-no-files-found: error
