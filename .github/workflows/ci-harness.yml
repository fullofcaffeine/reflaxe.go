name: CI Harness

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"
  HAXE_SETUP_RETRY_ATTEMPTS: "4"
  HAXE_SETUP_RETRY_DELAY_SEC: "5"
  HAXE_SETUP_RETRY_BACKOFF: "linear"
  HAXE_SETUP_WARMUP_ATTEMPTS: "3"
  GO_VERSION: "1.23.x"
  GO_METAL_COLLECTION_AUDIT_ENFORCE: "1"
  GO_METAL_COLLECTION_AUDIT_MAX: "0"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install npm dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Setup Haxe (linux, primary)
        id: setup_haxe_linux
        continue-on-error: true
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Ensure Haxe toolchain (linux)
        shell: bash
        env:
          SETUP_HAXE_OUTCOME: ${{ steps.setup_haxe_linux.outcome }}
        run: |
          set -euo pipefail
          warmup_attempts="${HAXE_SETUP_WARMUP_ATTEMPTS:-3}"
          if ! [[ "$warmup_attempts" =~ ^[1-9][0-9]*$ ]]; then
            echo "[haxe-setup] error: HAXE_SETUP_WARMUP_ATTEMPTS must be a positive integer" >&2
            exit 2
          fi

          warmup_haxe() {
            local attempt=1
            while (( attempt <= warmup_attempts )); do
              if command -v haxe >/dev/null 2>&1 && command -v haxelib >/dev/null 2>&1; then
                if haxe -version >/tmp/haxe-version.out 2>/tmp/haxe-version.err && haxelib version >/tmp/haxelib-version.out 2>/tmp/haxelib-version.err; then
                  echo "[haxe-setup] warmup success on attempt ${attempt}/${warmup_attempts}"
                  cat /tmp/haxe-version.out
                  cat /tmp/haxelib-version.out
                  return 0
                fi
                cat /tmp/haxe-version.err >&2 || true
                cat /tmp/haxelib-version.err >&2 || true
              fi
              if (( attempt < warmup_attempts )); then
                local delay=$((attempt * 2))
                echo "[haxe-setup] warmup failed on attempt ${attempt}; retrying in ${delay}s"
                sleep "$delay"
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          if [[ "${SETUP_HAXE_OUTCOME:-success}" != "success" ]]; then
            echo "[haxe-setup] primary setup action outcome=${SETUP_HAXE_OUTCOME}; running fallback installer"
            bash scripts/ci/setup-haxe-linux-fallback.sh
          fi

          if ! warmup_haxe; then
            echo "[haxe-setup] warmup failed after primary setup; running fallback installer"
            bash scripts/ci/setup-haxe-linux-fallback.sh
            warmup_haxe
          fi

      - name: Run stable CI surface
        run: npm run test:ci

      - name: Run full-scope metal collection audit
        run: |
          set -euo pipefail
          cmd=(python3 test/run-metal-example-boundary.py --scope full --mode audit --report .cache/metal-example-boundary/full-scope-audit.json)
          if [[ "${GO_METAL_COLLECTION_AUDIT_ENFORCE}" == "1" ]]; then
            cmd+=(--max-violations "${GO_METAL_COLLECTION_AUDIT_MAX}")
          fi
          "${cmd[@]}"

      - name: Upload metal collection audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-collection-audit
          path: .cache/metal-example-boundary
          if-no-files-found: warn

      - name: Check release visibility state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:status

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run dependency vulnerability audit
        run: npm run security:deps

  perf-go:
    name: Go Profile Perf (metal gated)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install npm dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Setup Haxe (linux, primary)
        id: setup_haxe_linux
        continue-on-error: true
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Ensure Haxe toolchain (linux)
        shell: bash
        env:
          SETUP_HAXE_OUTCOME: ${{ steps.setup_haxe_linux.outcome }}
        run: |
          set -euo pipefail
          warmup_attempts="${HAXE_SETUP_WARMUP_ATTEMPTS:-3}"
          if ! [[ "$warmup_attempts" =~ ^[1-9][0-9]*$ ]]; then
            echo "[haxe-setup] error: HAXE_SETUP_WARMUP_ATTEMPTS must be a positive integer" >&2
            exit 2
          fi

          warmup_haxe() {
            local attempt=1
            while (( attempt <= warmup_attempts )); do
              if command -v haxe >/dev/null 2>&1 && command -v haxelib >/dev/null 2>&1; then
                if haxe -version >/tmp/haxe-version.out 2>/tmp/haxe-version.err && haxelib version >/tmp/haxelib-version.out 2>/tmp/haxelib-version.err; then
                  echo "[haxe-setup] warmup success on attempt ${attempt}/${warmup_attempts}"
                  cat /tmp/haxe-version.out
                  cat /tmp/haxelib-version.out
                  return 0
                fi
                cat /tmp/haxe-version.err >&2 || true
                cat /tmp/haxelib-version.err >&2 || true
              fi
              if (( attempt < warmup_attempts )); then
                local delay=$((attempt * 2))
                echo "[haxe-setup] warmup failed on attempt ${attempt}; retrying in ${delay}s"
                sleep "$delay"
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          if [[ "${SETUP_HAXE_OUTCOME:-success}" != "success" ]]; then
            echo "[haxe-setup] primary setup action outcome=${SETUP_HAXE_OUTCOME}; running fallback installer"
            bash scripts/ci/setup-haxe-linux-fallback.sh
          fi

          if ! warmup_haxe; then
            echo "[haxe-setup] warmup failed after primary setup; running fallback installer"
            bash scripts/ci/setup-haxe-linux-fallback.sh
            warmup_haxe
          fi

      - name: Run Go profile benchmarks (metal budget enforced)
        run: npm run test:perf:go
        env:
          GO_PERF_ENFORCE_METAL_BUDGET: "1"
          GO_PERF_METAL_RUNTIME_FAIL_PCT: "300"
          GO_PERF_PORTABLE_CONCURRENCY_FASTPATH: "1"
          GO_PERF_DELTA_CASES: "string,string_instance,select,channel"
          GO_PERF_DELTA_WARN_PCT: "15"
          GO_PERF_ENFORCE_DELTA_BUDGET: "0"
          GO_PERF_DELTA_FAIL_PCT: "25"

      - name: Run HXRT selective runtime perf/size harness (budget enforced)
        run: npm run test:perf:hxrt-selective
        env:
          GO_HXRT_SLICE_ENFORCE: "1"

      - name: Upload Go perf benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-profile-perf-results
          path: .cache/perf-go/results
          if-no-files-found: warn

      - name: Upload HXRT selective harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-hxrt-selective-results
          path: .cache/perf-hxrt-selective/results
          if-no-files-found: warn

  perf-apps:
    name: Flagship App Perf (ratio compare)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install npm dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Setup Haxe (linux, primary)
        id: setup_haxe_linux
        continue-on-error: true
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Ensure Haxe toolchain (linux)
        shell: bash
        env:
          SETUP_HAXE_OUTCOME: ${{ steps.setup_haxe_linux.outcome }}
        run: |
          set -euo pipefail
          warmup_attempts="${HAXE_SETUP_WARMUP_ATTEMPTS:-3}"
          if ! [[ "$warmup_attempts" =~ ^[1-9][0-9]*$ ]]; then
            echo "[haxe-setup] error: HAXE_SETUP_WARMUP_ATTEMPTS must be a positive integer" >&2
            exit 2
          fi

          warmup_haxe() {
            local attempt=1
            while (( attempt <= warmup_attempts )); do
              if command -v haxe >/dev/null 2>&1 && command -v haxelib >/dev/null 2>&1; then
                if haxe -version >/tmp/haxe-version.out 2>/tmp/haxe-version.err && haxelib version >/tmp/haxelib-version.out 2>/tmp/haxelib-version.err; then
                  echo "[haxe-setup] warmup success on attempt ${attempt}/${warmup_attempts}"
                  cat /tmp/haxe-version.out
                  cat /tmp/haxelib-version.out
                  return 0
                fi
                cat /tmp/haxe-version.err >&2 || true
                cat /tmp/haxelib-version.err >&2 || true
              fi
              if (( attempt < warmup_attempts )); then
                local delay=$((attempt * 2))
                echo "[haxe-setup] warmup failed on attempt ${attempt}; retrying in ${delay}s"
                sleep "$delay"
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          if [[ "${SETUP_HAXE_OUTCOME:-success}" != "success" ]]; then
            echo "[haxe-setup] primary setup action outcome=${SETUP_HAXE_OUTCOME}; running fallback installer"
            bash scripts/ci/setup-haxe-linux-fallback.sh
          fi

          if ! warmup_haxe; then
            echo "[haxe-setup] warmup failed after primary setup; running fallback installer"
            bash scripts/ci/setup-haxe-linux-fallback.sh
            warmup_haxe
          fi

      - name: Run flagship app benchmark harness
        run: npm run test:perf:apps
        env:
          GO_APP_PERF_ENFORCE_METAL_BUDGET: "0"
          GO_APP_PERF_ENFORCE_DELTA_BUDGET: "0"
          GO_APP_PERF_DELTA_CASES: "pulseforge:core,pulseforge:go_native,fluxproxy:core,fluxproxy:go_native"
          GO_APP_PERF_DELTA_WARN_PCT: "15"
          GO_APP_PERF_DELTA_FAIL_PCT: "25"

      - name: Upload flagship app benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-app-perf-results
          path: .cache/perf-apps/results
          if-no-files-found: warn

  semantic-release:
    name: Semantic Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - quality
      - gitleaks
      - dependency-audit
      - perf-go
      - perf-apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
