name: CI Harness

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-harness-${{ github.workflow }}-${{ github.ref }}
  # A master run can enter publication after its required jobs pass.
  # Newer master pushes must not cancel that release transaction.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  HAXE_VERSION: "4.3.7"
  HAXE_SETUP_RETRY_ATTEMPTS: "4"
  HAXE_SETUP_RETRY_DELAY_SEC: "5"
  HAXE_SETUP_RETRY_BACKOFF: "linear"
  HAXE_SETUP_WARMUP_ATTEMPTS: "3"
  GO_VERSION: "1.26.6"
  GO_METAL_COLLECTION_AUDIT_ENFORCE: "1"
  GO_METAL_COLLECTION_AUDIT_MAX: "0"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      runner_image_os: ${{ steps.runner-image.outputs.os }}
      runner_image_version: ${{ steps.runner-image.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Record exact hosted runner image
        id: runner-image
        run: |
          test -n "${ImageOS:-}" && test -n "${ImageVersion:-}"
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup pinned npm
        run: bash scripts/ci/setup-pinned-npm.sh

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify locked dependencies and vendored provenance
        run: npm run security:supply-chain

      - name: Setup Haxe (linux)
        uses: ./.github/actions/setup-haxe-linux
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          warmup-attempts: ${{ env.HAXE_SETUP_WARMUP_ATTEMPTS }}

      - name: Run stable CI surface
        run: npm run test:ci

      - name: Upload official Haxe target smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-haxe-target-smoke
          path: .cache/official-haxe-target-smoke/artifacts
          if-no-files-found: error

      - name: Run full-scope metal collection audit
        run: |
          set -euo pipefail
          cmd=(python3 test/run-metal-example-boundary.py --scope full --mode audit --report .cache/metal-example-boundary/full-scope-audit.json)
          if [[ "${GO_METAL_COLLECTION_AUDIT_ENFORCE}" == "1" ]]; then
            cmd+=(--max-violations "${GO_METAL_COLLECTION_AUDIT_MAX}")
          fi
          "${cmd[@]}"

      - name: Upload metal collection audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metal-collection-audit
          path: .cache/metal-example-boundary
          if-no-files-found: warn

      - name: Upload generated output telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-output-telemetry
          path: .cache/generated-output-telemetry
          if-no-files-found: warn

      - name: Upload compiler debt report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-debt-report
          path: .cache/compiler-debt
          if-no-files-found: warn

      - name: Check release visibility state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:status

  official-haxe-target-inventory:
    name: Official Haxe target inventory (Go ${{ matrix.go }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.13", "1.26.6"]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned npm
        run: bash scripts/ci/setup-pinned-npm.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Setup Haxe (linux)
        uses: ./.github/actions/setup-haxe-linux
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          warmup-attempts: ${{ env.HAXE_SETUP_WARMUP_ATTEMPTS }}

      - name: Verify clean exact source
        run: |
          # krdlab/setup-haxe leaves these extracted, untracked setup folders in
          # the workspace after installing the toolchain into the hosted cache.
          rm -rf "haxe-${HAXE_VERSION}-linux64" "neko-2.4.0-linux64"
          git status --short
          test -z "$(git status --porcelain=v1)"

      - name: Run complete applicable official target inventory
        run: npm run test:official-haxe-inventory -- --require-clean-source

      - name: Upload exact-SHA inventory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-haxe-target-inventory-${{ matrix.go }}
          path: .cache/official-haxe-target-inventory/artifacts
          if-no-files-found: error

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.13", "1.26.6"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned npm
        run: bash scripts/ci/setup-pinned-npm.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Run dependency vulnerability audit
        run: npm run security:deps

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ matrix.go }}
          path: .cache/security
          if-no-files-found: warn

  go-tooling:
    name: Go Tooling Gates (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.13", "1.26.6"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Run release-blocking Go tooling gates
        run: python3 scripts/security/run-go-tooling-gates.py

      - name: Upload Go tooling gate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-tooling-${{ matrix.go }}
          path: .cache/security/go-tooling
          if-no-files-found: warn

  perf-go:
    name: Go Profile Perf (metal gated)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned npm
        run: bash scripts/ci/setup-pinned-npm.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Setup Haxe (linux)
        uses: ./.github/actions/setup-haxe-linux
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          warmup-attempts: ${{ env.HAXE_SETUP_WARMUP_ATTEMPTS }}

      - name: Run Go profile benchmarks (metal budget enforced)
        run: npm run test:perf:go
        env:
          GO_PERF_ENFORCE_METAL_BUDGET: "1"
          GO_PERF_METAL_RUNTIME_FAIL_PCT: "300"
          GO_PERF_PORTABLE_CONCURRENCY_FASTPATH: "1"
          GO_PERF_DELTA_CASES: "string,string_instance,select,channel"
          GO_PERF_DELTA_WARN_PCT: "15"
          GO_PERF_ENFORCE_DELTA_BUDGET: "0"
          GO_PERF_DELTA_FAIL_PCT: "25"

      - name: Run HXRT selective runtime perf/size harness (budget enforced)
        run: npm run test:perf:hxrt-selective
        env:
          GO_HXRT_SLICE_ENFORCE: "1"

      - name: Upload Go perf benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-profile-perf-results
          path: .cache/perf-go/results
          if-no-files-found: warn

      - name: Upload HXRT selective harness artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-hxrt-selective-results
          path: .cache/perf-hxrt-selective/results
          if-no-files-found: warn

  perf-apps:
    name: Flagship App Perf (ratio compare)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned npm
        run: bash scripts/ci/setup-pinned-npm.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Setup Haxe (linux)
        uses: ./.github/actions/setup-haxe-linux
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          warmup-attempts: ${{ env.HAXE_SETUP_WARMUP_ATTEMPTS }}

      - name: Run flagship app benchmark harness
        run: npm run test:perf:apps
        env:
          GO_APP_PERF_ENFORCE_METAL_BUDGET: "0"
          GO_APP_PERF_ENFORCE_DELTA_BUDGET: "0"
          GO_APP_PERF_DELTA_CASES: "pulseforge:core,pulseforge:go_native,fluxproxy:core,fluxproxy:go_native"
          GO_APP_PERF_DELTA_WARN_PCT: "15"
          GO_APP_PERF_DELTA_FAIL_PCT: "25"

      - name: Upload flagship app benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-app-perf-results
          path: .cache/perf-apps/results
          if-no-files-found: warn

  semantic-release:
    name: Complete Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - quality
      - official-haxe-target-inventory
      - gitleaks
      - dependency-audit
      - go-tooling
      - perf-go
      - perf-apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned npm
        run: bash scripts/ci/setup-pinned-npm.sh

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Setup Haxe (linux)
        uses: ./.github/actions/setup-haxe-linux
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          warmup-attempts: ${{ env.HAXE_SETUP_WARMUP_ATTEMPTS }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify release identity policy
        run: npm run release:policy

      - name: Verify approved licensing policy
        run: npm run release:license-policy

      - name: Collect remote Beads blocker evidence
        run: |
          CGO_ENABLED=1 GOFLAGS=-tags=gms_pure_go go install github.com/steveyegge/beads/cmd/bd@c3e600c940ad
          python3 scripts/release/refresh-readiness-blockers.py \
            --observed-at "$(date -u +%F)" \
            --remote "git+https://github.com/${{ github.repository }}.git" \
            --prefix "haxe_go" \
            --output "${{ runner.temp }}/haxe-go-release-blockers.json"

      - name: Collect exact-SHA upstream gate evidence
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          GO_TOOLING_RESULT: ${{ needs.go-tooling.result }}
        run: |
          python3 scripts/release/collect-upstream-release-evidence.py \
            --tested-sha "${{ github.sha }}" \
            --quality-result "$QUALITY_RESULT" \
            --gitleaks-result "$GITLEAKS_RESULT" \
            --dependency-audit-result "$DEPENDENCY_AUDIT_RESULT" \
            --go-tooling-result "$GO_TOOLING_RESULT" \
            --haxe-version "$(haxe --version)" \
            --node-version "$(node --version)" \
            --runner-image-os "${{ needs.quality.outputs.runner_image_os }}" \
            --runner-image-version "${{ needs.quality.outputs.runner_image_version }}" \
            --output "${{ runner.temp }}/haxe-go-upstream-release-evidence.json"

      - name: Select version and publish verified assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TESTED_SHA: ${{ github.sha }}
          RELEASE_UPSTREAM_GATES_SHA: ${{ github.sha }}
          RELEASE_UPSTREAM_EVIDENCE: ${{ runner.temp }}/haxe-go-upstream-release-evidence.json
          RELEASE_BLOCKER_EVIDENCE: ${{ runner.temp }}/haxe-go-release-blockers.json
        run: npm run release
