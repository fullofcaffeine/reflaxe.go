name: Setup Haxe on Linux
description: Install Haxe on Linux with warmup checks and fallback installer retries.
inputs:
  haxe-version:
    description: Haxe version passed to krdlab/setup-haxe.
    required: true
  warmup-attempts:
    description: Number of haxe/haxelib warmup attempts before falling back.
    required: false
    default: "3"
runs:
  using: composite
  steps:
    - name: Setup Haxe (linux, primary)
      id: setup_haxe_linux
      continue-on-error: true
      uses: krdlab/setup-haxe@v2
      with:
        haxe-version: ${{ inputs.haxe-version }}

    - name: Ensure Haxe toolchain (linux)
      shell: bash
      env:
        SETUP_HAXE_OUTCOME: ${{ steps.setup_haxe_linux.outcome }}
        HAXE_SETUP_WARMUP_ATTEMPTS: ${{ inputs.warmup-attempts }}
      run: |
        set -euo pipefail
        warmup_attempts="${HAXE_SETUP_WARMUP_ATTEMPTS:-3}"
        if ! [[ "$warmup_attempts" =~ ^[1-9][0-9]*$ ]]; then
          echo "[haxe-setup] error: HAXE_SETUP_WARMUP_ATTEMPTS must be a positive integer" >&2
          exit 2
        fi

        warmup_haxe() {
          local attempt=1
          while (( attempt <= warmup_attempts )); do
            if command -v haxe >/dev/null 2>&1 && command -v haxelib >/dev/null 2>&1; then
              if haxe -version >/tmp/haxe-version.out 2>/tmp/haxe-version.err && haxelib version >/tmp/haxelib-version.out 2>/tmp/haxelib-version.err; then
                echo "[haxe-setup] warmup success on attempt ${attempt}/${warmup_attempts}"
                cat /tmp/haxe-version.out
                cat /tmp/haxelib-version.out
                return 0
              fi
              cat /tmp/haxe-version.err >&2 || true
              cat /tmp/haxelib-version.err >&2 || true
            fi
            if (( attempt < warmup_attempts )); then
              local delay=$((attempt * 2))
              echo "[haxe-setup] warmup failed on attempt ${attempt}; retrying in ${delay}s"
              sleep "$delay"
            fi
            attempt=$((attempt + 1))
          done
          return 1
        }

        if [[ "${SETUP_HAXE_OUTCOME:-success}" != "success" ]]; then
          echo "[haxe-setup] primary setup action outcome=${SETUP_HAXE_OUTCOME}; running fallback installer"
          bash scripts/ci/setup-haxe-linux-fallback.sh
        fi

        if ! warmup_haxe; then
          echo "[haxe-setup] warmup failed after primary setup; running fallback installer"
          bash scripts/ci/setup-haxe-linux-fallback.sh
          warmup_haxe
        fi
